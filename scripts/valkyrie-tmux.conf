# Valkyrie's own tmux server, socket -L valkyrie. Deliberately NOT ~/.tmux.conf:
# this socket is driven by the phone UI, so its defaults are picked for a
# six-inch screen and for outliving an API restart, and none of that should
# change what a hand-run `tmux` does.

# The server outlives its last session. valkyrie-term.service starts it and
# therefore owns its cgroup; if the server exited when the session count hit
# zero, the next session would be started by the API process instead and would
# die with the next deploy.
set -g exit-empty off

# A pane whose command FAILS stays on screen with its last output, so a refused
# SSH login or a crashed Claude is readable from the phone instead of vanishing
# into "session ended" a frame later. A clean exit (Claude quit normally) still
# closes the session. The API reads #{pane_dead} to mark these.
set -g remain-on-exit failed

# Two lines of status bar is a lot of phone.
set -g status off

# Touch-drag scrolls the pane instead of doing nothing.
set -g mouse on
set -g history-limit 20000

# ESC is a real keystroke in Claude Code, not the start of a prefix sequence.
set -g escape-time 10

# The most recent client's size wins, so picking the session up on the phone
# reflows it to the phone instead of leaving it at the desktop's width.
set -g window-size latest
setw -g aggressive-resize on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
