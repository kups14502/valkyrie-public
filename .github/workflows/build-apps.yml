name: build-apps

# Builds the dedicated Tauri desktop apps and publishes a signed GitHub Release
# (with updater manifest) so installed apps auto-update.
#
# COST MANAGEMENT
# macOS runners cost 10× GitHub-hosted minutes; Linux 1×; Windows 2×.
# To stay well within the 2,000 free min/month:
#  - Auto (every push to main): Linux + Windows only (~15 min/run)
#  - Manual dispatch: choose "all" to include macOS, or leave default for Linux+Windows
#
# TODO: set matrix.runner for ubuntu to [self-hosted, linux] once the Actions
# runner is installed on the OpenClaw server — that drops Linux to 0 billed min.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Include macOS build (costs 10× minutes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — swap runner to [self-hosted, linux] once runner is configured
          # on the OpenClaw server to eliminate these billed minutes entirely.
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
          # Windows — 2× minute multiplier (~10 min/build)
          - platform: windows-latest
            runner: windows-latest
          # macOS — 10× minute multiplier (~50 min/build). Only on manual dispatch
          # when explicitly opted in to avoid burning the monthly minute quota.
          - platform: macos-latest
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    # Skip macOS unless this is a manual dispatch that explicitly opts in.
    if: >-
      matrix.platform != 'macos-latest' ||
      (github.event_name == 'workflow_dispatch' && inputs.include_macos == 'true')

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Set build version (so installed apps detect the update)
        run: node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n')"

      - name: Build + release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: https://master-control-api.brendonkupsch.com
          VITE_BUILD_ID: ${{ github.sha }}
        with:
          projectPath: frontend
          tagName: app-v__VERSION__
          releaseName: Valkyrie v__VERSION__
          releaseDraft: false
          prerelease: false

      - name: Upload installers (short-lived run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: valkyrie-${{ matrix.platform }}
          retention-days: 2
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/**/*
            frontend/src-tauri/target/*/release/bundle/**/*
