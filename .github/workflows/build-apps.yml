name: build-apps

# Builds the dedicated Tauri desktop apps (Windows / macOS / Linux) on every
# push to main that touches the frontend, plus on-demand via "Run workflow".
# Installers are uploaded as downloadable artifacts on each run. Android and
# iOS are added in a later pass.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
        env:
          # Bake the production API host into the bundled web build.
          VITE_API_URL: https://master-control-api.brendonkupsch.com
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: master-control-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/**/*
            frontend/src-tauri/target/*/release/bundle/**/*
