name: build-apps

# Builds the dedicated Tauri desktop apps (Windows / macOS / Linux) on every
# push to main that touches the frontend, plus on-demand. Publishes a signed
# GitHub Release (with the updater manifest latest.json) so installed apps
# auto-update. Installers are also uploaded as run artifacts for direct download.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Set build version (so installed apps detect the update)
        run: node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n')"

      - name: Build + release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: https://master-control-api.brendonkupsch.com
          VITE_BUILD_ID: ${{ github.sha }}
        with:
          projectPath: frontend
          tagName: app-v__VERSION__
          releaseName: Valkyrie v__VERSION__
          releaseDraft: false
          prerelease: false

      - name: Upload installers (short-lived run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: master-control-${{ matrix.platform }}
          retention-days: 2
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/**/*
            frontend/src-tauri/target/*/release/bundle/**/*
