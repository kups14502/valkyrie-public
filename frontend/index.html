    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Valkyrie" />
    <!-- black, never black-translucent: under a translucent bar iOS 26 lays its Liquid Glass edge
         blur over the status strip, and no CSS turns it off. iOS reads this only when the app is
         added to the Home Screen, so a change needs the app removed and added again. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
