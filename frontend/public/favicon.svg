<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b07"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1024" height="1024" rx="208" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="176" fill="none" stroke="#00ff41" stroke-opacity="0.22" stroke-width="4"/>

  <!-- terminal prompt: chevron + underscore cursor -->
  <g filter="url(#glow)" fill="none" stroke="#00ff41" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="356,352 568,512 356,672"/>
    <line x1="600" y1="672" x2="724" y2="672"/>
  </g>
</svg>
